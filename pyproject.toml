[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motioniq"
version = "0.1.0"
description = "Research infrastructure for video-based movement analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "python-multipart==0.0.17",
]

[project.optional-dependencies]
vision = ["mediapipe==0.10.18", "ultralytics==8.3.40"]
training = ["torch==2.5.1"]
dev = ["pytest==8.3.3", "ruff==0.8.0", "httpx==0.27.2"]

[tool.setuptools.packages.find]
include = ["motioniq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
